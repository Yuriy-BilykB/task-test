services:
  backend:
    image: yur14/todos-backend:latest
    container_name: todos-backend
    ports:
      - "5050:5050"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/todos
    depends_on:
      - db

  frontend:
    image: yur14/todos-frontend:latest
    container_name: todos-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5050
    depends_on:
      - backend

  db:
    image: postgres:16
    container_name: todos-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: