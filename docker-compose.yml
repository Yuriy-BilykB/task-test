services:
  backend:
    image: yur14/todos-backend:latest
    container_name: todos-backend
    ports:
      - "5050:5050"
    environment:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/todos


  frontend:
    image: yur14/todos-frontend:latest
    container_name: todos-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5050
    depends_on:
      - backend
